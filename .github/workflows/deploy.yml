name: Deploy to Cloudflare Workers

# Deploys via the OpenNext Cloudflare adapter on every push to main.
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — dashboard → My Profile → API Tokens → Create Token
#                            → "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  — dashboard → Workers & Pages → right sidebar
# Until the secrets exist, the deploy job detects that and skips cleanly.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping deploy."
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'

      - name: Setup Node
        if: steps.creds.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.ok == 'true'
        run: npm ci

      - name: Install Cloudflare adapter
        if: steps.creds.outputs.ok == 'true'
        run: npm install -D @opennextjs/cloudflare@~1.15.0 wrangler@^4

      - name: Build with OpenNext
        if: steps.creds.outputs.ok == 'true'
        run: npx opennextjs-cloudflare build

      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
